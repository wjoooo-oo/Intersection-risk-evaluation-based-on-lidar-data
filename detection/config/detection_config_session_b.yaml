preprocess:
  range_split_m: 40.0
  voxel_near_m: 0.08
  voxel_far_m: 0.12
  skip_far_downsample: true
  z_min: -2.5
  z_max: 4.0
  ground_removal:
    method: grid_local_min
    cell: 1.0
    delta: 0.28
    z_global_max: 3.5

clustering:
  method: dbscan
  range_split_m: 40.0
  eps_near: 1.0
  eps_far: 2.4
  min_samples_near: 3
  min_samples_far: 2
  min_cluster_near: 6
  min_cluster_far: 4
  max_cluster_points: 8000
  bbox_method: obb
  nms_iou: 0.3

classification:
  promote_vehicle_like_unknown: true
  promote_min_range_m: 20.0
  promote_min_height_m: 0.45
  vehicle:
    min_length: 1.0
    max_length: 10.0
    min_width: 0.5
    max_width: 4.0
    min_height: 0.65
    max_height: 4.5
    min_height_to_length: 0.16
    min_points: 5
  vehicle_far:
    range_min_m: 40.0
    min_length: 0.8
    max_length: 12.0
    min_width: 0.4
    max_width: 4.5
    min_height: 0.4
    max_height: 4.5
    min_height_to_length: 0.1
    min_points: 3
  pedestrian:
    min_length: 0.2
    max_length: 1.2
    min_width: 0.2
    max_width: 1.2
    min_height: 0.6
    max_height: 2.3
    min_points: 5

background_filter:
  resolution: 1.0
  history_frames: 80
  static_threshold: 0.85
  warmup_frames: 30
  exempt_classes:
    - vehicle
    - pedestrian

tracking:
  max_age: 15
  min_hits: 2
  min_track_age: 2
  distance_threshold: 6.0
  process_noise_pos: 0.5
  process_noise_vel: 1.0
  measurement_noise: 0.4
  max_trajectory_length: 100
  size_ema_alpha: 0.35
  size_ema_min_points: 6
  min_track_speed: 0.0
  speed_window: 5
  nms_iou: 0.3

visualization:
  publish_raw_cloud: true
  publish_detection_markers: false
  roi_marker_color: [0.0, 1.0, 1.0, 0.8]
  vehicle_color: [0.0, 1.0, 0.0, 0.6]
  pedestrian_color: [1.0, 1.0, 0.0, 0.6]
  unknown_color: [0.5, 0.5, 0.5, 0.4]
